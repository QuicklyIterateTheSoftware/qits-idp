# Test-only overrides. This module is the deployable, so its app-level settings live in
# src/main/resources/application.properties and Quarkus MERGES that file into the test config — it
# is not shadowed by this one. Never re-declare an app-level setting here: a test copy that drifts
# from the shipped copy makes the suite lie, passing on a value no deployment ever gets.

# A FREE port, not Quarkus' default test port 8081 — on the deployment host that address is the
# platform's own npm registry (qits-artifacts), so the default dies with "Port already bound" in a
# way that reads like a code failure. 0 lets the OS pick and RestAssured is told the real port.
# Failsafe passes the same value to the packaged artifact (service/pom.xml).
quarkus.http.test-port=0

# The service suite runs against in-memory H2 (no files under ~), overriding the file-H2 default
# shipped in the idp jar's META-INF/microprofile-config.properties. clean-at-start wipes between
# runs, so every run generates its own signing key.
quarkus.datasource.idp.db-kind=h2
quarkus.datasource.idp.jdbc.url=jdbc:h2:mem:idp-svc;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.idp.datasource=idp
quarkus.hibernate-orm.idp.packages=eu.wohlben.qits.idp.entity
quarkus.flyway.idp.migrate-at-start=true
quarkus.flyway.idp.clean-at-start=true
quarkus.flyway.idp.locations=classpath:db/idp/migration

# --- the suite's own clients ---------------------------------------------------------------------
#
# THE ONE PLACE this file re-declares a shipped setting, and it has to: qits.idp.clients is the list
# of ids that exist, so a test client cannot be added without restating it. The four shipped service
# ids are repeated verbatim — they are what the suite's blank-secret case runs against.
#
# prod-qits-gateway deliberately gets NO secret here. That is the shipped state of every service
# client, and IdpTokenTest.aClientWithNoSecretIsUnusable asserts against it rather than against a
# test-only client, so the suite is pinning the real default rather than a fixture.
qits.idp.clients=prod-qits-ci,qits-platform-artifacts,prod-qits-workspaces,prod-qits-gateway,test-broad,test-narrow,test-audienceless

# The everyday client: two audiences and one granted claim, so one request can show both the
# default-to-all audience rule and that ungranted claims stay out.
qits.idp.client.test-broad.secret=test-broad-secret
qits.idp.client.test-broad.audiences=prod-qits-ci,prod-qits-deployments
qits.idp.client.test-broad.claims.project=qits

# One audience only — the invalid_target case asks it for another.
qits.idp.client.test-narrow.secret=test-narrow-secret
qits.idp.client.test-narrow.audiences=prod-qits-deployments

# A secret but no audiences: a client that authenticates and can still be issued nothing.
qits.idp.client.test-audienceless.secret=test-audienceless-secret
